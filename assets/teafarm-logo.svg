<svg width="100%" viewBox="0 0 680 680" role="img">
  <title>TeaFarm logo with falling leaves</title>
  <desc>Circular green logo with tea leaf, animated steam, Tea Farm text inside, and continuously falling tea leaves around it</desc>

  <defs>
    <style>
      .spin { transform-origin: 340px 340px; animation: rotateSlow 12s linear infinite; }
      .leafPulse { animation: pulse 3s ease-in-out infinite; transform-origin: 340px 320px; }
      .steam1 { animation: steamRise 2.8s ease-in-out infinite; }
      .steam2 { animation: steamRise 2.8s ease-in-out infinite 0.9s; }
      .steam3 { animation: steamRise 2.8s ease-in-out infinite 1.8s; }
      .dropBounce { animation: dropFall 2.8s ease-in-out infinite; }
      .fl1  { animation: fall1  4.2s linear infinite; }
      .fl2  { animation: fall2  5.8s linear infinite 0.6s; }
      .fl3  { animation: fall3  4.9s linear infinite 1.2s; }
      .fl4  { animation: fall4  6.1s linear infinite 0.3s; }
      .fl5  { animation: fall5  5.2s linear infinite 1.8s; }
      .fl6  { animation: fall6  4.6s linear infinite 2.4s; }
      .fl7  { animation: fall7  5.5s linear infinite 0.9s; }
      .fl8  { animation: fall8  4.8s linear infinite 3.1s; }
      .fl9  { animation: fall9  6.3s linear infinite 1.5s; }
      .fl10 { animation: fall10 5.0s linear infinite 2.8s; }
      .fl11 { animation: fall11 4.4s linear infinite 0.4s; }
      .fl12 { animation: fall12 5.7s linear infinite 3.6s; }
      @keyframes rotateSlow { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
      @keyframes steamRise {
        0%{opacity:0;transform:translateY(0)} 30%{opacity:0.9}
        70%{opacity:0.4;transform:translateY(-36px) scaleX(1.3)}
        100%{opacity:0;transform:translateY(-58px) scaleX(0.8)}
      }
      @keyframes dropFall {
        0%,100%{transform:translateY(0);opacity:1} 50%{transform:translateY(8px);opacity:0.7}
      }
      @keyframes fall1  { 0%{transform:translate(0,0) rotate(0deg);opacity:0} 10%{opacity:1} 90%{opacity:0.6} 100%{transform:translate(-18px,660px) rotate(320deg);opacity:0} }
      @keyframes fall2  { 0%{transform:translate(0,0) rotate(20deg);opacity:0} 10%{opacity:1} 90%{opacity:0.5} 100%{transform:translate(22px,660px) rotate(-280deg);opacity:0} }
      @keyframes fall3  { 0%{transform:translate(0,0) rotate(-10deg);opacity:0} 10%{opacity:1} 90%{opacity:0.7} 100%{transform:translate(15px,660px) rotate(300deg);opacity:0} }
      @keyframes fall4  { 0%{transform:translate(0,0) rotate(35deg);opacity:0} 10%{opacity:1} 90%{opacity:0.4} 100%{transform:translate(-25px,660px) rotate(-340deg);opacity:0} }
      @keyframes fall5  { 0%{transform:translate(0,0) rotate(-20deg);opacity:0} 10%{opacity:1} 90%{opacity:0.6} 100%{transform:translate(20px,660px) rotate(310deg);opacity:0} }
      @keyframes fall6  { 0%{transform:translate(0,0) rotate(10deg);opacity:0} 10%{opacity:1} 90%{opacity:0.5} 100%{transform:translate(-12px,660px) rotate(-290deg);opacity:0} }
      @keyframes fall7  { 0%{transform:translate(0,0) rotate(-30deg);opacity:0} 10%{opacity:1} 90%{opacity:0.7} 100%{transform:translate(28px,660px) rotate(330deg);opacity:0} }
      @keyframes fall8  { 0%{transform:translate(0,0) rotate(15deg);opacity:0} 10%{opacity:1} 90%{opacity:0.5} 100%{transform:translate(-20px,660px) rotate(-310deg);opacity:0} }
      @keyframes fall9  { 0%{transform:translate(0,0) rotate(-5deg);opacity:0} 10%{opacity:1} 90%{opacity:0.6} 100%{transform:translate(16px,660px) rotate(280deg);opacity:0} }
      @keyframes fall10 { 0%{transform:translate(0,0) rotate(40deg);opacity:0} 10%{opacity:1} 90%{opacity:0.4} 100%{transform:translate(-30px,660px) rotate(-350deg);opacity:0} }
      @keyframes fall11 { 0%{transform:translate(0,0) rotate(-15deg);opacity:0} 10%{opacity:1} 90%{opacity:0.7} 100%{transform:translate(24px,660px) rotate(320deg);opacity:0} }
      @keyframes fall12 { 0%{transform:translate(0,0) rotate(25deg);opacity:0} 10%{opacity:1} 90%{opacity:0.5} 100%{transform:translate(-16px,660px) rotate(-300deg);opacity:0} }
    </style>
    <clipPath id="cc"><circle cx="340" cy="340" r="290"/></clipPath>
  </defs>

  <!-- falling leaves -->
