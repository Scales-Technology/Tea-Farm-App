    <path d="M340 245 C322 255,305 263,292 274" fill="none" stroke="#1a7a40" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M340 282 C318 294,298 304,283 317" fill="none" stroke="#1a7a40" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M340 318 C320 330,302 340,288 353" fill="none" stroke="#1a7a40" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M340 354 C323 366,308 375,296 387" fill="none" stroke="#1a7a40" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M340 245 C358 255,375 263,388 274" fill="none" stroke="#1a7a40" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M340 282 C362 294,382 304,397 317" fill="none" stroke="#1a7a40" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M340 318 C360 330,378 340,392 353" fill="none" stroke="#1a7a40" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M340 354 C357 366,372 375,384 387" fill="none" stroke="#1a7a40" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M340 178 C348 165,358 158,365 151 C352 153,344 161,340 178Z" fill="#4aba72"/>
  </g>

  <!-- steam -->
  <g class="steam1" style="transform-origin:310px 235px">
    <path d="M310 235 C304 223,316 213,310 200" fill="none" stroke="#a8e6bf" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  </g>
  <g class="steam2" style="transform-origin:340px 225px">
    <path d="M340 225 C334 210,346 197,340 183" fill="none" stroke="#a8e6bf" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  </g>
  <g class="steam3" style="transform-origin:370px 235px">
    <path d="M370 235 C364 223,376 213,370 200" fill="none" stroke="#a8e6bf" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- tea drop -->
  <g class="dropBounce">
    <path d="M340 458 C334 470,326 482,326 490 C326 502,332 510,340 510 C348 510,354 502,354 490 C354 482,346 470,340 458Z" fill="#4aba72"/>
    <ellipse cx="337" cy="488" rx="4" ry="6" fill="#6dcc8e" opacity="0.6"/>
  </g>

  <!-- accent leaves -->
  <path d="M188 210 C196 198,214 196,222 208 C214 214,198 218,188 210Z" fill="#4aba72" opacity="0.7"/>
  <path d="M176 230 C182 216,200 212,210 222 C202 230,184 236,176 230Z" fill="#2ecc71" opacity="0.5"/>
  <path d="M492 210 C484 198,466 196,458 208 C466 214,482 218,492 210Z" fill="#4aba72" opacity="0.7"/>
  <path d="M504 230 C498 216,480 212,470 222 C478 230,496 236,504 230Z" fill="#2ecc71" opacity="0.5"/>

  <!-- Tea Farm text inside -->
  <text x="340" y="572" text-anchor="middle"
        font-family="'Georgia', serif" font-size="52" font-weight="700"
        letter-spacing="5" fill="#ffffff">Tea Farm</text>

</svg>