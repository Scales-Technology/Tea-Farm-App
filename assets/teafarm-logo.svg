  <g class="fl2"  style="transform-origin:140px -30px"><path d="M140,-30 C147,-23,150,-12,143,-4 C136,4,124,2,120,-6 C116,-14,122,-26,132,-30 C135,-31,140,-30,140,-30Z" fill="#27ae60" opacity="0.75"/><path d="M140,-30 C136,-18,132,-8,128,-4" fill="none" stroke="#1a7a40" stroke-width="1" stroke-linecap="round"/></g>
  <g class="fl3"  style="transform-origin:55px 60px"><path d="M55,60 C62,67,64,78,57,85 C50,91,40,88,37,80 C34,72,40,61,50,58 C52,57,55,60,55,60Z" fill="#4aba72" opacity="0.7"/><path d="M55,60 C51,72,48,80,45,85" fill="none" stroke="#1a7a40" stroke-width="1" stroke-linecap="round"/></g>
  <g class="fl4"  style="transform-origin:30px 180px"><path d="M30,180 C38,187,40,198,33,205 C26,211,16,208,13,200 C10,192,16,181,26,178 C28,177,30,180,30,180Z" fill="#2ecc71" opacity="0.65"/><path d="M30,180 C26,192,23,200,20,205" fill="none" stroke="#1a7a40" stroke-width="1" stroke-linecap="round"/></g>
  <g class="fl5"  style="transform-origin:620px -20px"><path d="M620,-20 C627,-13,630,-2,623,6 C616,13,605,10,602,2 C599,-6,605,-17,615,-21 C618,-22,620,-20,620,-20Z" fill="#27ae60" opacity="0.8"/><path d="M620,-20 C616,-8,612,2,608,6" fill="none" stroke="#1a7a40" stroke-width="1" stroke-linecap="round"/></g>
  <g class="fl6"  style="transform-origin:560px 10px"><path d="M560,10 C567,17,570,28,563,36 C556,43,545,40,542,32 C539,24,545,13,555,9 C558,8,560,10,560,10Z" fill="#4aba72" opacity="0.7"/><path d="M560,10 C556,22,552,32,548,36" fill="none" stroke="#1a7a40" stroke-width="1" stroke-linecap="round"/></g>
  <g class="fl7"  style="transform-origin:640px 120px"><path d="M640,120 C648,127,650,138,643,146 C636,153,625,150,622,142 C619,134,625,122,635,119 C638,118,640,120,640,120Z" fill="#2ecc71" opacity="0.75"/><path d="M640,120 C636,132,632,142,628,146" fill="none" stroke="#1a7a40" stroke-width="1" stroke-linecap="round"/></g>
  <g class="fl8"  style="transform-origin:600px 220px"><path d="M600,220 C607,227,610,238,603,246 C596,253,585,250,582,242 C579,234,585,222,595,219 C598,218,600,220,600,220Z" fill="#27ae60" opacity="0.65"/><path d="M600,220 C596,232,592,242,588,246" fill="none" stroke="#1a7a40" stroke-width="1" stroke-linecap="round"/></g>
  <g class="fl9"  style="transform-origin:200px -40px"><path d="M200,-40 C208,-33,210,-22,203,-14 C196,-7,185,-10,182,-18 C179,-26,185,-37,195,-41 C198,-42,200,-40,200,-40Z" fill="#4aba72" opacity="0.8"/><path d="M200,-40 C196,-28,192,-18,188,-14" fill="none" stroke="#1a7a40" stroke-width="1" stroke-linecap="round"/></g>
  <g class="fl10" style="transform-origin:480px -15px"><path d="M480,-15 C488,-8,490,3,483,11 C476,18,465,15,462,7 C459,-1,465,-12,475,-16 C478,-17,480,-15,480,-15Z" fill="#2ecc71" opacity="0.7"/><path d="M480,-15 C476,-3,472,7,468,11" fill="none" stroke="#1a7a40" stroke-width="1" stroke-linecap="round"/></g>
  <g class="fl11" style="transform-origin:100px 300px"><path d="M100,300 C108,307,110,318,103,326 C96,333,85,330,82,322 C79,314,85,302,95,299 C98,298,100,300,100,300Z" fill="#27ae60" opacity="0.75"/><path d="M100,300 C96,312,92,322,88,326" fill="none" stroke="#1a7a40" stroke-width="1" stroke-linecap="round"/></g>
  <g class="fl12" style="transform-origin:650px 300px"><path d="M650,300 C658,307,660,318,653,326 C646,333,635,330,632,322 C629,314,635,302,645,299 C648,298,650,300,650,300Z" fill="#4aba72" opacity="0.7"/><path d="M650,300 C646,312,642,322,638,326" fill="none" stroke="#1a7a40" stroke-width="1" stroke-linecap="round"/></g>

  <!-- logo circle -->
  <circle cx="340" cy="340" r="290" fill="#1a4a2e"/>
  <circle cx="340" cy="340" r="270" fill="none" stroke="#2d6e45" stroke-width="3"/>
  <circle cx="340" cy="340" r="254" fill="none" stroke="#2d6e45" stroke-width="1"/>
  <g class="spin">
    <circle cx="340" cy="340" r="280" fill="none" stroke="#3a8a56" stroke-width="2" stroke-dasharray="18 10" stroke-linecap="round"/>
  </g>
  <circle cx="340" cy="58"  r="5" fill="#4aba72"/>
  <circle cx="340" cy="622" r="5" fill="#4aba72"/>
  <circle cx="58"  cy="340" r="5" fill="#4aba72"/>
  <circle cx="622" cy="340" r="5" fill="#4aba72"/>

  <!-- tea leaf -->
  <g class="leafPulse">
    <path d="M340 155 C400 185,460 255,450 330 C440 405,390 450,340 460 C290 450,240 405,230 330 C220 255,280 185,340 155Z" fill="#2ecc71" opacity="0.15"/>
    <path d="M340 178 C385 203,428 265,420 332 C412 398,374 438,340 446 C306 438,268 398,260 332 C252 265,295 203,340 178Z" fill="#27ae60"/>
    <path d="M340 192 C372 212,404 262,398 326 C393 376,370 410,350 425 C330 410,308 376,302 326 C297 262,310 212,340 192Z" fill="#2ecc71" opacity="0.5"/>
